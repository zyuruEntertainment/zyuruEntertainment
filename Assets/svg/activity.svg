
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="190" viewBox="0 0 760 190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="13" height="13"
             patternUnits="userSpaceOnUse">
      <rect width="10" height="10" rx="2" fill="#161b22"/>
    </pattern>

    <clipPath id="area">
      <rect x="26" y="48" width="708" height="100" rx="3"/>
    </clipPath>

    <style>
      .cell {
        transform-box: fill-box;
        transform-origin: center;
        animation: appear 7s both infinite;
      }

      .particle {
        opacity: 0;
        animation: burst 7s infinite;
      }

      @keyframes appear {
        0%, 5% {
          opacity: 0;
          transform: scale(0);
        }
        15%, 57% {
          opacity: 1;
          transform: scale(1);
        }
        65% {
          opacity: 1;
          transform: scale(.9);
        }
        72%, 100% {
          opacity: 0;
          transform: scale(0);
        }
      }

      @keyframes burst {
        0%, 60% {
          opacity: 0;
          transform: translate(0, 0) scale(.2);
        }
        65% {
          opacity: 1;
        }
        85%, 100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cell, .particle {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </defs>

  <rect width="760" height="190" rx="12" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="759" height="189" rx="11"
        fill="none" stroke="#30363d"/>

  <text x="26" y="26" fill="#e6edf3"
        font-family="monospace" font-size="13" font-weight="bold">
    CONTRIBUTION ACTIVITY
  </text>

  <circle cx="710" cy="21" r="4" fill="#39d353">
    <animate attributeName="opacity"
             values="1;.25;1" dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="722" y="25" fill="#8b949e"
        font-family="monospace" font-size="9">LIVE</text>

  <g transform="translate(26 48)">
    <rect width="708" height="91" fill="url(#grid)"/>
  </g>

  <g id="contributions" clip-path="url(#area)">
    <!-- generator replaces this group with real daily contributions -->
    <text x="26" y="95" fill="#8b949e"
          font-family="monospace" font-size="11">
      waiting for contribution data...
    </text>
  </g>

  <text x="26" y="169" fill="#8b949e"
        font-family="monospace" font-size="10">
    ZYURUMENTERTAINMENT // AUTO GENERATED
  </text>

  <text x="734" y="169" fill="#39d353"
        font-family="monospace" font-size="10" text-anchor="end">
    LOOP ∞
  </text>
</svg>
